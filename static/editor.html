<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #444; }
    #placeholder { width: 100%; height: 100vh; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 999;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 16px; opacity: 0.9; }
    #loading small { font-size: 12px; opacity: 0.6; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Opening document in OnlyOffice…</p>
    <small id="doc-name"></small>
  </div>
  <div id="placeholder"></div>

  <!-- OnlyOffice Document Editor API -->
  <script>
    // Dynamically load api.js from current host or localhost
    const docServerHost = window.location.hostname || 'localhost';
    document.write('<script src="http://' + docServerHost + '/web-apps/apps/api/documents/api.js"><\/script>');
  </script>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const fileName = params.get('fileName') || 'document';
    const fileExt  = (params.get('fileext') || '.docx').replace('.', '');
    const fileUrl  = params.get('url');
    const docType  = params.get('documentType') || 'word';
    const key      = params.get('key') || Date.now().toString();

    document.getElementById('doc-name').textContent = fileName;

    if (!fileUrl) {
      document.getElementById('loading').innerHTML =
        '<p style="color:#ffcccc">❌ No document URL provided.</p>';
    } else {
      const docEditor = new DocsAPI.DocEditor('placeholder', {
        document: {
          fileType: fileExt,
          key:      key,
          title:    fileName,
          url:      fileUrl,
          permissions: {
            download:        true,
            edit:            true,
            print:           true,
            review:          true,
            fillForms:       true,
            modifyFilter:    true,
            modifyContentControl: true,
          },
        },
        documentType: docType,
        editorConfig: {
          mode: 'edit',
          lang: 'en',
        },
        events: {
          onAppReady: function () {
            document.getElementById('loading').style.display = 'none';
          },
          onError: function (event) {
            console.error('OnlyOffice error:', event);
            document.getElementById('loading').innerHTML =
              `<p style="color:#ffcccc">❌ Editor error: ${JSON.stringify(event.data)}</p>`;
          },
        },
        height: '100%',
        width:  '100%',
      });
    }
  </script>
</body>
</html>
